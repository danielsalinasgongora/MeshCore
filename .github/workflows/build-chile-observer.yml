name: Build Chile Observer Firmware

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version label, for example v1.17.1-chile.1
        required: false
        default: v1.17.1-chile
  push:
    tags:
      - 'chile-observer-v*'

env:
  TARGET_ENV: heltec_v4_repeater_observer_mqtt_chile

jobs:
  build:
    name: Build Heltec V4 Chile observer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#chile-observer-}"
          fi
          if [ -z "$version" ]; then
            version="v1.17.1-chile"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $TARGET_ENV as $version"

      - name: Build firmware
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
          DISABLE_DEBUG: '1'
        run: /usr/bin/env bash build.sh build-firmware "$TARGET_ENV"

      - name: Rename release assets
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          for f in out/${TARGET_ENV}-*.bin; do
            base=$(basename "$f")
            cp "$f" "release/${base}"
          done
          cp firmware-notes.html release/firmware-notes.html
          cat > release/README-flash.txt <<'EOF'
MeshCore Chile Observer firmware for Heltec V4 only. Do not flash this binary on other hardware.

Recommended file for a clean USB flash:
- Use the file ending in -merged.bin.

Target:
- heltec_v4_repeater_observer_mqtt_chile

After flashing, configure WiFi, node name, admin password, position and private channels from serial or the web panel.
EOF
          ls -lh release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chile-observer-heltec-v4
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/chile-observer-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chile Observer Firmware ${{ steps.version.outputs.version }}
          body: |
            Firmware Observer MeshCore para Chile, solo para HELTEC V4.

            Para flasheo limpio por USB en HELTEC V4, descarga el archivo que termina en `-merged.bin`. No uses este binario en otro hardware.

            Después del flash, configura tus datos propios por serial o desde el panel web: WiFi, nombre del nodo, contraseña admin, ubicación, bot y canales privados.
          files: release/*
